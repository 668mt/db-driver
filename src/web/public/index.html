<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>db-driver 配置</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #6b7280;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
        --success: #16a34a;
        --warning: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --border: #334155;
          --text: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }
      @media (max-width: 800px) {
        .container { grid-template-columns: 1fr; }
      }
      h1 {
        font-size: 22px;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .list-item {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .list-item:hover { background: rgba(99, 102, 241, 0.08); }
      .list-item.active {
        border-color: var(--primary);
        background: rgba(37, 99, 235, 0.08);
      }
      .list-item-title { font-weight: 600; }
      .list-item-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 600px) {
        .form-grid { grid-template-columns: 1fr; }
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input, select, textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
        color: var(--text);
        font-size: 14px;
      }
      input:focus, select:focus, textarea:focus {
        outline: 2px solid var(--primary);
        outline-offset: -1px;
      }
      .full { grid-column: 1 / -1; }
      .permissions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-top: 12px;
        padding: 12px;
        background: rgba(99, 102, 241, 0.06);
        border-radius: 6px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 14px;
      }
      .checkbox input { width: auto; }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
        transition: all 0.15s;
      }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }
      button.primary:hover { background: var(--primary-hover); }
      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: white;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 20px;
        border-radius: 8px;
        color: white;
        font-size: 14px;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.3s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.success { background: var(--success); }
      .toast.error { background: var(--danger); }
      .empty {
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .new-btn {
        width: 100%;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>数据库连接</h1>
        <button class="primary new-btn" id="new-btn">+ 新建连接</button>
        <div class="list" id="list"></div>
      </div>

      <div class="card" id="editor">
        <div class="empty" id="placeholder">请选择左侧连接或点击"新建连接"</div>
        <div id="form" style="display:none">
          <h2>连接配置</h2>
          <div class="form-grid">
            <div>
              <label>dbId *</label>
              <input id="dbId" placeholder="例如 my-app-db" />
            </div>
            <div>
              <label>类型 *</label>
              <select id="type">
                <option value="mysql">MySQL</option>
                <option value="postgres">PostgreSQL</option>
              </select>
            </div>
            <div>
              <label>Host *</label>
              <input id="host" placeholder="127.0.0.1" />
            </div>
            <div>
              <label>Port *</label>
              <input id="port" type="number" placeholder="3306 / 5432" />
            </div>
            <div>
              <label>User *</label>
              <input id="user" placeholder="root" />
            </div>
            <div>
              <label>Password *</label>
              <input id="password" type="password" placeholder="••••••" />
            </div>
            <div class="full">
              <label>Database *</label>
              <input id="database" placeholder="数据库名 / Schema 名" />
            </div>
          </div>

          <h2 style="margin-top:24px">权限</h2>
          <div class="permissions">
            <label class="checkbox">
              <input type="checkbox" id="dmlQuery" checked />
              允许 SELECT 查询
            </label>
            <label class="checkbox">
              <input type="checkbox" id="dmlUpdate" />
              允许 INSERT / UPDATE
            </label>
            <label class="checkbox">
              <input type="checkbox" id="dmlDelete" />
              允许 DELETE
            </label>
            <label class="checkbox">
              <input type="checkbox" id="ddl" />
              允许 DDL (CREATE/ALTER/DROP)
            </label>
          </div>

          <div class="actions">
            <button class="primary" id="save-btn">保存</button>
            <button id="test-btn">测试连接</button>
            <button class="danger" id="delete-btn" style="display:none">删除</button>
            <button id="cancel-btn">取消</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const listEl = $('list');
      const formEl = $('form');
      const placeholderEl = $('placeholder');
      let connections = [];
      let current = null;

      function showToast(msg, type = 'success') {
        const t = $('toast');
        t.textContent = msg;
        t.className = `toast show ${type}`;
        setTimeout(() => { t.className = 'toast'; }, 2400);
      }

      async function loadList() {
        const res = await fetch('/api/connections');
        connections = await res.json();
        renderList();
      }

      function renderList() {
        if (connections.length === 0) {
          listEl.innerHTML = '<div class="empty">还没有连接</div>';
          return;
        }
        listEl.innerHTML = connections
          .map(
            (c) => `
            <div class="list-item ${current?.dbId === c.dbId ? 'active' : ''}" data-id="${c.dbId}">
              <div class="list-item-title">${c.dbId}</div>
              <div class="list-item-meta">${c.type} · ${c.user}@${c.host}:${c.port}/${c.database}</div>
            </div>`
          )
          .join('');
        listEl.querySelectorAll('.list-item').forEach((el) => {
          el.addEventListener('click', () => selectConn(el.dataset.id));
        });
      }

      async function selectConn(dbId) {
        const res = await fetch('/api/connections/' + encodeURIComponent(dbId));
        if (!res.ok) { showToast('未找到', 'error'); return; }
        current = await res.json();
        fillForm();
        renderList();
      }

      function fillForm() {
        formEl.style.display = '';
        placeholderEl.style.display = 'none';
        $('dbId').value = current.dbId;
        $('dbId').disabled = true;
        $('type').value = current.type;
        $('host').value = current.host;
        $('port').value = current.port;
        $('user').value = current.user;
        $('password').value = current.password;
        $('database').value = current.database;
        $('dmlQuery').checked = current.permissions.dmlQuery;
        $('dmlUpdate').checked = current.permissions.dmlUpdate;
        $('dmlDelete').checked = current.permissions.dmlDelete;
        $('ddl').checked = current.permissions.ddl;
        $('delete-btn').style.display = '';
      }

      function resetForm() {
        current = { dbId: '', type: 'mysql', host: '', port: 3306, user: '', password: '', database: '', permissions: { dmlQuery: true, dmlUpdate: false, dmlDelete: false, ddl: false } };
        formEl.style.display = '';
        placeholderEl.style.display = 'none';
        $('dbId').value = '';
        $('dbId').disabled = false;
        $('type').value = 'mysql';
        $('host').value = '';
        $('port').value = 3306;
        $('user').value = '';
        $('password').value = '';
        $('database').value = '';
        $('dmlQuery').checked = true;
        $('dmlUpdate').checked = false;
        $('dmlDelete').checked = false;
        $('ddl').checked = false;
        $('delete-btn').style.display = 'none';
        renderList();
      }

      function readForm() {
        return {
          dbId: $('dbId').value.trim(),
          type: $('type').value,
          host: $('host').value.trim(),
          port: Number($('port').value),
          user: $('user').value.trim(),
          password: $('password').value,
          database: $('database').value.trim(),
          permissions: {
            dmlQuery: $('dmlQuery').checked,
            dmlUpdate: $('dmlUpdate').checked,
            dmlDelete: $('dmlDelete').checked,
            ddl: $('ddl').checked,
          },
        };
      }

      $('new-btn').addEventListener('click', resetForm);
      $('cancel-btn').addEventListener('click', () => {
        formEl.style.display = 'none';
        placeholderEl.style.display = '';
        current = null;
        renderList();
      });

      $('save-btn').addEventListener('click', async () => {
        const body = readForm();
        if (!body.dbId) { showToast('dbId 不能为空', 'error'); return; }
        if (!body.host || !body.port || !body.user || !body.database) {
          showToast('请填写必填字段', 'error');
          return;
        }
        const res = await fetch('/api/connections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json();
          showToast('保存失败: ' + (err.error || res.status), 'error');
          return;
        }
        current = await res.json();
        showToast('已保存');
        await loadList();
      });

      $('test-btn').addEventListener('click', async () => {
        const body = readForm();
        if (!body.host || !body.user || !body.database) {
          showToast('请填写连接信息', 'error');
          return;
        }
        $('test-btn').disabled = true;
        $('test-btn').textContent = '测试中...';
        try {
          const res = await fetch('/api/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (data.ok) showToast('连接成功');
          else showToast('连接失败: ' + data.error, 'error');
        } finally {
          $('test-btn').disabled = false;
          $('test-btn').textContent = '测试连接';
        }
      });

      $('delete-btn').addEventListener('click', async () => {
        if (!current) return;
        if (!confirm(`确定要删除 "${current.dbId}" 吗？`)) return;
        const res = await fetch('/api/connections/' + encodeURIComponent(current.dbId), { method: 'DELETE' });
        if (res.ok) {
          showToast('已删除');
          current = null;
          formEl.style.display = 'none';
          placeholderEl.style.display = '';
          await loadList();
        }
      });

loadList();

      // 心跳：保持 WebSocket 连接，关闭浏览器时 CLI 能感知到并自动退出
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}`);
      ws.onclose = () => {
        // 连接断开后给后端一点时间检测"最后一个客户端关闭"
      };
      window.addEventListener('beforeunload', () => {
        try { ws.close(); } catch (_) {}
      });
    </script>
  </body>
</html>
