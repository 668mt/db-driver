<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>db-driver · 连接管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light dark;
        --bg-grad-1: #dbeafe;
        --bg-grad-2: #e0e7ff;
        --card: rgba(255, 255, 255, 0.75);
        --card-border: rgba(37, 99, 235, 0.18);
        --card-shadow: 0 10px 40px -10px rgba(37, 99, 235, 0.18), 0 2px 6px rgba(0, 0, 0, 0.04);
        --input-bg: rgba(255, 255, 255, 0.85);
        --input-border: rgba(37, 99, 235, 0.2);
        --input-focus: #2563eb;
        --text: #1e3a8a;
        --muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-grad: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --success: #16a34a;
        --warning: #d97706;
        --badge-mysql-bg: #dbeafe;
        --badge-mysql-fg: #1e40af;
        --badge-pg-bg: #cffafe;
        --badge-pg-fg: #155e75;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-1: #0c1830;
          --bg-grad-2: #1e3a8a;
          --card: rgba(15, 23, 42, 0.6);
          --card-border: rgba(96, 165, 250, 0.2);
          --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
          --input-bg: rgba(15, 23, 42, 0.6);
          --input-border: rgba(96, 165, 250, 0.22);
          --input-focus: #60a5fa;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --primary: #60a5fa;
          --primary-hover: #93c5fd;
          --primary-grad: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
          --danger: #f87171;
          --danger-hover: #fca5a5;
          --success: #4ade80;
          --warning: #fbbf24;
          --badge-mysql-bg: rgba(59, 130, 246, 0.2);
          --badge-mysql-fg: #93c5fd;
          --badge-pg-bg: rgba(34, 211, 238, 0.18);
          --badge-pg-fg: #67e8f9;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        background:
          radial-gradient(circle at 0% 0%, var(--bg-grad-1) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, var(--bg-grad-2) 0%, transparent 50%),
          var(--bg-grad-1);
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--primary-grad);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        box-shadow: 0 4px 14px -2px rgba(124, 58, 237, 0.5);
      }
      .brand-text h1 {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .brand-text p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      .header-meta {
        font-size: 12px;
        color: var(--muted);
      }
      .header-meta code {
        padding: 2px 8px;
        border-radius: 4px;
        background: var(--card);
        border: 1px solid var(--card-border);
        font-family: 'SF Mono', Consolas, Monaco, monospace;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }
      @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; }
      }

      .card {
        background: var(--card);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        padding: 24px;
      }

      .sidebar h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .list-item {
        position: relative;
        padding: 12px 14px;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.18s ease;
        background: var(--input-bg);
      }
      .list-item:hover {
        transform: translateY(-1px);
        border-color: var(--primary);
        box-shadow: 0 4px 12px -4px rgba(124, 58, 237, 0.25);
      }
      .list-item.active {
        border-color: var(--primary);
        background: var(--input-bg);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
      }
      .list-item.active::before {
        content: '';
        position: absolute;
        left: -1px; top: 12px; bottom: 12px;
        width: 3px;
        border-radius: 2px;
        background: var(--primary-grad);
      }
      .list-item-title {
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list-item-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list-item-desc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        font-style: italic;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-mysql { background: var(--badge-mysql-bg); color: var(--badge-mysql-fg); }
      .badge-postgres { background: var(--badge-pg-bg); color: var(--badge-pg-fg); }

      .new-btn {
        width: 100%;
        margin-bottom: 12px;
        padding: 10px;
        border-radius: 10px;
        border: 1px dashed var(--input-border);
        background: transparent;
        color: var(--primary);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .new-btn:hover {
        background: var(--primary-grad);
        color: white;
        border-color: transparent;
        border-style: solid;
      }

      .form-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--card-border);
      }
      .form-header h2 {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
      }
      .form-header .form-mode {
        font-size: 12px;
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--input-bg);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 600px) {
        .form-grid { grid-template-columns: 1fr; }
      }
      .full { grid-column: 1 / -1; }

      .field { display: flex; flex-direction: column; }
      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      label .req { color: var(--danger); margin-left: 2px; }

      input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--input-border);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        transition: all 0.18s ease;
      }
      #password {
        -webkit-text-security: disc;
        text-security: disc;
      }
      .password-field {
        position: relative;
      }
      .password-field #password {
        padding-right: 40px;
      }
      .password-toggle {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .password-toggle:hover {
        background: var(--input-border);
        color: var(--text);
      }
      .password-field.password-shown #password {
        -webkit-text-security: none;
        text-security: none;
      }
      .password-field.password-shown .password-toggle {
        color: var(--primary);
        background: rgba(37, 99, 235, 0.1);
      }
      .password-field .eye-hide { display: none; }
      .password-field.password-shown .eye-show { display: none; }
      .password-field.password-shown .eye-hide { display: block; }
      input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.7; }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
      }
      input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

      .section-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 28px 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--card-border);
      }

      .permissions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 14px;
        padding: 10px 12px;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        background: var(--input-bg);
        transition: all 0.18s ease;
        user-select: none;
      }
      .checkbox:hover { border-color: var(--primary); }
      .checkbox input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--primary);
        cursor: pointer;
      }
      .checkbox-label { flex: 1; }
      .checkbox-desc {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--card-border);
        flex-wrap: wrap;
      }

      button {
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.18s ease;
        font-family: inherit;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button.primary {
        background: var(--primary-grad);
        border-color: transparent;
        color: white;
        box-shadow: 0 4px 12px -2px rgba(124, 58, 237, 0.4);
      }
      button.primary:hover {
        box-shadow: 0 6px 20px -2px rgba(124, 58, 237, 0.55);
      }
      button.danger {
        background: transparent;
        color: var(--danger);
        border-color: var(--danger);
      }
      button.danger:hover {
        background: var(--danger);
        color: white;
        box-shadow: 0 4px 12px -2px rgba(220, 38, 38, 0.4);
      }
      button.ghost {
        background: transparent;
        border-color: transparent;
      }
      button.ghost:hover { background: var(--input-bg); }
      button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-right: 6px;
        vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 14px 22px;
        border-radius: 12px;
        color: white;
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        z-index: 1000;
      }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.success { background: rgba(22, 163, 74, 0.92); }
      .toast.error { background: rgba(220, 38, 38, 0.92); }

      .empty {
        padding: 60px 24px;
        text-align: center;
        color: var(--muted);
      }
      .empty-icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.5;
      }
      .empty-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .empty-hint {
        font-size: 13px;
        color: var(--muted);
      }
      .empty-list {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        border: 1px dashed var(--card-border);
        border-radius: 10px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-backdrop.show { opacity: 1; pointer-events: auto; }
      .modal {
        background: var(--card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 28px;
        max-width: 400px;
        width: 90%;
        box-shadow: var(--card-shadow);
        transform: scale(0.95);
        transition: transform 0.2s;
      }
      .modal-backdrop.show .modal { transform: scale(1); }
      .modal h3 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      .modal p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      [data-anim] {
        opacity: 0;
        transform: translateY(8px);
        animation: fade-up 0.3s ease forwards;
      }
      @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }

      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        padding: 4px;
        background: var(--card);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        width: fit-content;
        box-shadow: var(--card-shadow);
      }
      .tab {
        padding: 8px 16px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.18s ease;
        font-family: inherit;
      }
      .tab:hover { color: var(--text); }
      .tab.active {
        background: var(--primary-grad);
        color: white;
        box-shadow: 0 2px 8px -2px rgba(37, 99, 235, 0.4);
      }

      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        padding: 8px 10px;
        background: var(--input-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
      }
      .filter-bar select {
        flex: 1;
        padding: 6px 10px;
        border: none;
        background: transparent;
        font-size: 13px;
      }
      .search-bar {
        margin-bottom: 10px;
      }
      .search-bar input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="brand-mark">🗄</div>
          <div class="brand-text">
            <h1>db-driver 控制台</h1>
            <p>连接配置 + SQL 用法笔记 · 本地加密存储</p>
          </div>
        </div>
        <div class="header-meta">
          <code id="brand-version">v__APP_VERSION__</code>
        </div>
      </header>

      <div class="tabs">
        <button class="tab active" data-tab="connections">📚 连接配置</button>
        <button class="tab" data-tab="usage">💡 用法笔记</button>
      </div>

      <div class="layout">
        <aside class="card sidebar" data-anim style="animation-delay:0ms">
          <div data-pane="connections">
            <h2>连接列表</h2>
            <button class="new-btn" id="new-btn">+ 新建连接</button>
            <div class="list" id="list"></div>
          </div>
          <div data-pane="usage" style="display:none">
            <h2>用法列表</h2>
            <div class="filter-bar">
              <label style="margin:0;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;color:var(--muted)">dbId</label>
              <select id="usage-filter">
                <option value="">全部库</option>
              </select>
            </div>
            <div class="search-bar">
              <input id="usage-search" type="search" placeholder="搜索内容（不区分大小写）" />
            </div>
            <button class="new-btn" id="usage-new-btn">+ 新增用法</button>
            <div class="list" id="usage-list"></div>
          </div>
        </aside>

        <main class="card" data-anim style="animation-delay:60ms">
          <div data-pane="connections">
            <div class="empty" id="placeholder">
              <div class="empty-icon">⬅</div>
              <div class="empty-title">从左侧选择或新建连接</div>
              <div class="empty-hint">所有配置以加密二进制存于 OS keyring</div>
            </div>

            <div id="form" style="display:none">
              <div class="form-header">
                <h2 id="form-title">连接配置</h2>
                <span class="form-mode" id="form-mode">新建</span>
              </div>

              <div class="form-grid">
                <div class="field">
                  <label>dbId <span class="req">*</span></label>
                  <input id="dbId" placeholder="例如 my-app-db" autocomplete="off" />
                </div>
                <div class="field">
                  <label>类型 <span class="req">*</span></label>
                  <select id="type">
                    <option value="mysql">MySQL</option>
                    <option value="postgres">PostgreSQL</option>
                  </select>
                </div>
                <div class="field">
                  <label>Host <span class="req">*</span></label>
                  <input id="host" placeholder="127.0.0.1" autocomplete="off" />
                </div>
                <div class="field">
                  <label>Port <span class="req">*</span></label>
                  <input id="port" type="number" placeholder="3306 / 5432" />
                </div>
                <div class="field">
                  <label>User <span class="req">*</span></label>
                  <input id="user" placeholder="root" autocomplete="off" />
                </div>
                <div class="field password-field">
                  <label>Password <span class="req">*</span></label>
                  <input id="password" type="text" placeholder="••••••" autocomplete="off" data-form-type="other" data-lpignore="true" data-1pignore="true" data-bwignore="true" spellcheck="false" />
                  <button type="button" class="password-toggle" id="password-toggle" title="显示/隐藏密码">
                    <svg class="eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
                <div class="field full">
                  <label>Database <span class="req">*</span></label>
                  <input id="database" placeholder="数据库名（catalog）" autocomplete="off" />
                </div>
                <div class="field full" id="schema-row" style="display:none">
                  <label>Schema <span style="color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0">（可选，仅 PostgreSQL）</span></label>
                  <input id="schema" placeholder="PostgreSQL 用，默认 public" autocomplete="off" />
                </div>
                <div class="field full">
                  <label>描述 <span style="color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0">（可选，便于区分多套同形环境）</span></label>
                  <textarea id="description" rows="2" placeholder="如：生产 / 预发 / 测试"></textarea>
                </div>
              </div>

              <div class="section-title">权限</div>
              <div class="permissions">
                <label class="checkbox">
                  <input type="checkbox" id="dmlQuery" checked />
                  <div class="checkbox-label">
                    SELECT
                    <span class="checkbox-desc">只读查询</span>
                  </div>
                </label>
                <label class="checkbox">
                  <input type="checkbox" id="dmlUpdate" />
                  <div class="checkbox-label">
                    INSERT / UPDATE
                    <span class="checkbox-desc">新增和修改</span>
                  </div>
                </label>
                <label class="checkbox">
                  <input type="checkbox" id="dmlDelete" />
                  <div class="checkbox-label">
                    DELETE
                    <span class="checkbox-desc">删除数据</span>
                  </div>
                </label>
                <label class="checkbox">
                  <input type="checkbox" id="ddl" />
                  <div class="checkbox-label">
                    DDL
                    <span class="checkbox-desc">建表、改表、删表</span>
                  </div>
                </label>
              </div>

              <div class="actions">
                <button class="primary" id="save-btn">保存</button>
                <button id="test-btn">测试连接</button>
                <button class="danger" id="delete-btn" style="display:none">删除</button>
                <button class="ghost" id="cancel-btn">取消</button>
              </div>
            </div>
          </div>

          <div data-pane="usage" style="display:none">
            <div class="empty" id="usage-placeholder">
              <div class="empty-icon">⬅</div>
              <div class="empty-title">从左侧选择或新增用法</div>
              <div class="empty-hint">SQL 用法以明文 Markdown 存储，便于人工查看和编辑</div>
            </div>

            <div id="usage-form" style="display:none">
              <div class="form-header">
                <h2 id="usage-form-title">新增用法</h2>
                <span class="form-mode" id="usage-form-mode">新增</span>
              </div>

              <div class="form-grid">
                <div class="field full">
                  <label>dbId <span class="req">*</span></label>
                  <select id="usage-dbId"></select>
                </div>
                <div class="field full">
                  <label>标题 <span class="req">*</span></label>
                  <input id="usage-title" placeholder="如：查询活跃用户 / 踩坑：online_id 大小写" autocomplete="off" />
                </div>
                <div class="field full">
                  <label>笔记内容 <span class="req">*</span></label>
                  <textarea id="usage-content" rows="10" placeholder="Markdown 格式的内容。&#10;&#10;例：&#10;查询最近 24h 活跃用户：&#10;&#10;  ```sql
  SELECT * FROM users WHERE last_active > NOW() - INTERVAL 1 DAY
  ```&#10;&#10;踩坑：online_id 字段在 PG 大小写敏感，要用引号。" style="font-family:'SF Mono',Consolas,Monaco,monospace;font-size:13px;line-height:1.5"></textarea>
                </div>
              </div>

              <div class="actions">
                <button class="primary" id="usage-save-btn">保存</button>
                <button class="danger" id="usage-delete-btn" style="display:none">删除</button>
                <button class="ghost" id="usage-cancel-btn">取消</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3 id="modal-title">确认删除</h3>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button class="ghost" id="modal-cancel">取消</button>
          <button class="danger" id="modal-confirm">删除</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let activeTab = 'connections';
      let connections = [];
      let current = null;
      let usages = [];
      let currentUsage = null;
      let pendingDelete = null;

      try {
        const m = document.querySelector('meta[name="version"]');
        if (m) $('brand-version').textContent = 'v' + m.content;
      } catch (_) {}

      function showToast(msg, type = 'success') {
        const t = $('toast');
        t.textContent = msg;
        t.className = `toast show ${type}`;
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => { t.className = 'toast'; }, 2400);
      }

      function showModal(title, text, onConfirm, confirmText = '删除', danger = true) {
        $('modal-title').textContent = title;
        $('modal-text').textContent = text;
        pendingDelete = onConfirm;
        const btn = $('modal-confirm');
        btn.textContent = confirmText;
        btn.className = danger ? 'danger' : 'primary';
        $('modal-backdrop').classList.add('show');
      }
      function hideModal() {
        $('modal-backdrop').classList.remove('show');
        pendingDelete = null;
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      function switchTab(name) {
        activeTab = name;
        document.querySelectorAll('.tab').forEach((el) => {
          el.classList.toggle('active', el.dataset.tab === name);
        });
        document.querySelectorAll('[data-pane]').forEach((el) => {
          el.style.display = el.dataset.pane === name ? '' : 'none';
        });
      }
      document.querySelectorAll('.tab').forEach((el) => {
        el.addEventListener('click', () => switchTab(el.dataset.tab));
      });

      // ===== 连接 tab =====
      const listEl = $('list');
      const formEl = $('form');
      const placeholderEl = $('placeholder');

      async function loadList() {
        const res = await fetch('/api/connections');
        const next = await res.json();
        if (JSON.stringify(next) === JSON.stringify(connections)) return;
        connections = next;
        renderList();
        if (typeof renderUsageDbIdOptions === 'function') {
          renderUsageDbIdOptions();
          renderUsageFilterOptions();
        }
      }

      function renderList() {
        if (connections.length === 0) {
          listEl.innerHTML = '<div class="empty-list">还没有连接<br>点击上方 + 新建连接</div>';
          return;
        }
        listEl.innerHTML = connections.map((c) => {
          const badge = c.type === 'mysql'
            ? '<span class="badge badge-mysql">MySQL</span>'
            : '<span class="badge badge-postgres">PG</span>';
          return `
            <div class="list-item ${current?.dbId === c.dbId ? 'active' : ''}" data-id="${escapeHtml(c.dbId)}">
              <div class="list-item-title">${badge} ${escapeHtml(c.dbId)}</div>
              <div class="list-item-meta">${escapeHtml(c.user)}@${escapeHtml(c.host)}:${c.port}/${escapeHtml(c.database)}</div>
              ${c.description ? `<div class="list-item-desc">${escapeHtml(c.description)}</div>` : ''}
            </div>`;
        }).join('');
        listEl.querySelectorAll('.list-item').forEach((el) => {
          el.addEventListener('click', () => selectConn(el.dataset.id));
        });
      }

      async function selectConn(dbId) {
        const res = await fetch('/api/connections/' + encodeURIComponent(dbId));
        if (!res.ok) { showToast('未找到', 'error'); return; }
        current = await res.json();
        fillForm();
        renderList();
      }

      function fillForm() {
        formEl.style.display = '';
        placeholderEl.style.display = 'none';
        $('dbId').value = current.dbId;
        $('dbId').disabled = true;
        $('type').value = current.type;
        $('host').value = current.host;
        $('port').value = current.port;
        $('user').value = current.user;
        $('password').value = current.password;
        $('database').value = current.database;
        $('schema').value = current.schema ?? '';
        $('description').value = current.description ?? '';
        $('dmlQuery').checked = current.permissions.dmlQuery;
        $('dmlUpdate').checked = current.permissions.dmlUpdate;
        $('dmlDelete').checked = current.permissions.dmlDelete;
        $('ddl').checked = current.permissions.ddl;
        $('delete-btn').style.display = '';
        $('form-title').textContent = '编辑 ' + current.dbId;
        $('form-mode').textContent = '编辑中';
        updateSchemaVisibility();
      }

      function resetForm() {
        current = { dbId: '', type: 'mysql', host: '', port: 3306, user: '', password: '', database: '', schema: '', description: '', permissions: { dmlQuery: true, dmlUpdate: false, dmlDelete: false, ddl: false } };
        formEl.style.display = '';
        placeholderEl.style.display = 'none';
        $('dbId').value = '';
        $('dbId').disabled = false;
        $('type').value = 'mysql';
        $('host').value = '';
        $('port').value = 3306;
        $('user').value = '';
        $('password').value = '';
        $('database').value = '';
        $('schema').value = '';
        $('description').value = '';
        $('dmlQuery').checked = true;
        $('dmlUpdate').checked = false;
        $('dmlDelete').checked = false;
        $('ddl').checked = false;
        $('delete-btn').style.display = 'none';
        $('form-title').textContent = '新建连接';
        $('form-mode').textContent = '新建';
        updateSchemaVisibility();
        renderList();
      }

      function updateSchemaVisibility() {
        $('schema-row').style.display = $('type').value === 'postgres' ? '' : 'none';
      }

      function readForm() {
        return {
          dbId: $('dbId').value.trim(),
          type: $('type').value,
          host: $('host').value.trim(),
          port: Number($('port').value),
          user: $('user').value.trim(),
          password: $('password').value,
          database: $('database').value.trim(),
          schema: $('schema').value.trim(),
          description: $('description').value.trim(),
          permissions: {
            dmlQuery: $('dmlQuery').checked,
            dmlUpdate: $('dmlUpdate').checked,
            dmlDelete: $('dmlDelete').checked,
            ddl: $('ddl').checked,
          },
        };
      }

      $('new-btn').addEventListener('click', resetForm);
      $('type').addEventListener('change', updateSchemaVisibility);

      // 密码显示/隐藏切换（type 永远是 text，避免浏览器弹出"保存密码"）
      const passwordFieldEl = document.querySelector('.password-field');
      $('password-toggle').addEventListener('click', () => {
        passwordFieldEl.classList.toggle('password-shown');
      });
      $('cancel-btn').addEventListener('click', () => {
        formEl.style.display = 'none';
        placeholderEl.style.display = '';
        current = null;
        renderList();
      });

      $('save-btn').addEventListener('click', async () => {
        const body = readForm();
        if (!body.dbId) { showToast('dbId 不能为空', 'error'); return; }
        if (!body.host || !body.port || !body.user || !body.database) {
          showToast('请填写必填字段', 'error');
          return;
        }
        const saveBtn = $('save-btn');
        saveBtn.disabled = true;
        const origText = saveBtn.textContent;
        saveBtn.innerHTML = '<span class="spinner"></span>保存中...';
        try {
          const res = await fetch('/api/connections', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            const err = await res.json();
            showToast('保存失败: ' + (err.error || res.status), 'error');
            return;
          }
          current = await res.json();
          showToast('✓ 已保存');
          await loadList();
          fillForm();
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = origText;
        }
      });

      $('test-btn').addEventListener('click', async () => {
        const body = readForm();
        if (!body.host || !body.user || !body.database) {
          showToast('请填写连接信息', 'error');
          return;
        }
        const btn = $('test-btn');
        btn.disabled = true;
        const orig = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span>测试中...';
        try {
          const res = await fetch('/api/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (data.ok) showToast('✓ 连接成功', 'success');
          else showToast('✗ 连接失败: ' + data.error, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = orig;
        }
      });

      $('delete-btn').addEventListener('click', () => {
        if (!current) return;
        showModal('确认删除', `确定要删除连接 "${current.dbId}" 吗？此操作不可撤销。`, async () => {
          const res = await fetch('/api/connections/' + encodeURIComponent(current.dbId), { method: 'DELETE' });
          if (res.ok) {
            showToast('已删除');
            current = null;
            formEl.style.display = 'none';
            placeholderEl.style.display = '';
            await loadList();
          } else {
            showToast('删除失败', 'error');
          }
        });
      });

      // ===== 用法 tab =====
      const usageListEl = $('usage-list');
      const usageFormEl = $('usage-form');
      const usagePlaceholderEl = $('usage-placeholder');
      const usageFilterEl = $('usage-filter');
      const usageSearchEl = $('usage-search');
      const usageDbIdEl = $('usage-dbId');
      let usageFilterDbId = '';
      let usageSearch = '';

      function renderUsageDbIdOptions() {
        const prev = usageDbIdEl.value;
        const opts = ['<option value="">-- 选择 dbId --</option>'];
        for (const c of connections) {
          opts.push(`<option value="${escapeHtml(c.dbId)}">${escapeHtml(c.dbId)} (${escapeHtml(c.type)})</option>`);
        }
        usageDbIdEl.innerHTML = opts.join('');
        if (connections.some((c) => c.dbId === prev)) usageDbIdEl.value = prev;
      }

      function renderUsageFilterOptions() {
        const prev = usageFilterEl.value;
        const opts = ['<option value="">全部库</option>'];
        for (const c of connections) {
          opts.push(`<option value="${escapeHtml(c.dbId)}">${escapeHtml(c.dbId)}</option>`);
        }
        usageFilterEl.innerHTML = opts.join('');
        usageFilterEl.value = connections.some((c) => c.dbId === prev) ? prev : '';
        usageFilterDbId = usageFilterEl.value;
      }

async function loadUsageList() {
        const params = [];
        if (usageFilterDbId) params.push(`dbId=${encodeURIComponent(usageFilterDbId)}`);
        if (usageSearch) params.push(`search=${encodeURIComponent(usageSearch)}`);
        const url = '/api/usage' + (params.length ? '?' + params.join('&') : '');
        const res = await fetch(url);
        const next = await res.json();
        if (JSON.stringify(next) === JSON.stringify(usages)) return;
        usages = next;
        renderUsageList();
      }

      function renderUsageList() {
        if (usages.length === 0) {
          const desc = usageSearch ? `匹配 "${usageSearch}"` : (usageFilterDbId ? `dbId=${usageFilterDbId}` : '');
          usageListEl.innerHTML = `<div class="empty-list">没有${desc ? ' ' + escapeHtml(desc) + ' 的' : ''}用法<br>点击上方 + 新增</div>`;
          return;
        }
        usageListEl.innerHTML = usages.map((u) => {
          const isActive = currentUsage?.index === u.index;
          const firstLine = u.content.split('\n')[0];
          const preview = firstLine.length > 80 ? firstLine.slice(0, 80) + '…' : firstLine;
          return `
            <div class="list-item ${isActive ? 'active' : ''}" data-index="${u.index}">
              <div class="list-item-title">[${u.index}] ${escapeHtml(u.dbId)}</div>
              <div class="list-item-meta">${escapeHtml(u.addedAt)}</div>
              <div class="list-item-desc">${escapeHtml(preview)}</div>
            </div>`;
        }).join();
        usageListEl.querySelectorAll('.list-item').forEach((el) => {
          el.addEventListener('click', () => selectUsage(parseInt(el.dataset.index, 10)));
        });
      }

      async function selectUsage(index) {
        const entry = usages.find((u) => u.index === index);
        if (!entry) return;
        currentUsage = entry;
        $('usage-content').value = entry.content;
        usageDbIdEl.value = entry.dbId;
        usageFormEl.style.display = '';
        usagePlaceholderEl.style.display = 'none';
        $('usage-form-title').textContent = '编辑用法 [' + index + ']';
        $('usage-form-mode').textContent = '编辑中';
        $('usage-delete-btn').style.display = '';
        renderUsageList();
      }

      function resetUsageForm() {
        currentUsage = null;
        $('usage-content').value = '';
        usageDbIdEl.value = '';
        usageFormEl.style.display = '';
        usagePlaceholderEl.style.display = 'none';
        $('usage-form-title').textContent = '新增用法';
        $('usage-form-mode').textContent = '新增';
        $('usage-delete-btn').style.display = 'none';
        renderUsageList();
      }

      $('usage-new-btn').addEventListener('click', resetUsageForm);
      $('usage-cancel-btn').addEventListener('click', () => {
        usageFormEl.style.display = 'none';
        usagePlaceholderEl.style.display = '';
        currentUsage = null;
        $('usage-delete-btn').style.display = 'none';
        renderUsageList();
      });

      $('usage-delete-btn').addEventListener('click', async () => {
        if (!currentUsage) return;
        const idx = currentUsage.index;
        const btn = $('usage-delete-btn');
        btn.disabled = true;
        const orig = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span>删除中...';
        try {
          const res = await fetch(`/api/usage/${idx}`, { method: 'DELETE' });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showToast('删除失败: ' + (err.error || res.status), 'error');
            return;
          }
          showToast('✓ 已删除');
          currentUsage = null;
          $('usage-note').value = '';
          $('usage-sql').value = '';
          $('usage-delete-btn').style.display = 'none';
          usageFormEl.style.display = 'none';
          usagePlaceholderEl.style.display = '';
          await loadUsageList();
        } finally {
          btn.disabled = false;
          btn.textContent = orig;
        }
      });

      usageFilterEl.addEventListener('change', () => {
        usageFilterDbId = usageFilterEl.value;
        loadUsageList();
      });

      let searchTimer = null;
      usageSearchEl.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          usageSearch = usageSearchEl.value.trim();
          loadUsageList();
        }, 200);
      });

      $('usage-save-btn').addEventListener('click', async () => {
        const content = $('usage-content').value.trim();
        const dbId = usageDbIdEl.value;
        if (!dbId) { showToast('请选择 dbId', 'error'); return; }
        if (!content) { showToast('笔记内容不能为空', 'error'); return; }
        const url = currentUsage
          ? `/api/usage/${currentUsage.index}`
          : '/api/usage';
        const method = currentUsage ? 'PUT' : 'POST';
        const btn = $('usage-save-btn');
        btn.disabled = true;
        const orig = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span>保存中...';
        try {
          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, dbId }),
          });
          if (!res.ok) {
            const err = await res.json();
            showToast('保存失败: ' + (err.error || res.status), 'error');
            return;
          }
          showToast('✓ 已保存');
          currentUsage = null;
          $('usage-content').value = '';
          usageDbIdEl.value = '';
          usageFormEl.style.display = 'none';
          usagePlaceholderEl.style.display = '';
          await loadUsageList();
        } finally {
          btn.disabled = false;
          btn.textContent = orig;
        }
      });

      // ===== modal =====
      $('modal-cancel').addEventListener('click', hideModal);
      $('modal-backdrop').addEventListener('click', (e) => {
        if (e.target === $('modal-backdrop')) hideModal();
      });
      $('modal-confirm').addEventListener('click', () => {
        const cb = pendingDelete;
        hideModal();
        if (cb) cb();
      });

      loadList();
      loadUsageList();

      // 定时轮询，刷新其他窗口/CLI 的改动
      setInterval(() => {
        if (activeTab === 'connections' && !current) {
          loadList();
        } else if (activeTab === 'usage' && !currentUsage) {
          loadUsageList();
        }
      }, 2000);

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}`);
      ws.onclose = () => {};
      window.addEventListener('beforeunload', () => {
        try { ws.close(); } catch (_) {}
      });
    </script>
  </body>
</html>
